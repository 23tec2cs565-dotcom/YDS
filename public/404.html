<!doctype html>
<html lang=en>
  <head>
    <meta charset=UTF-8 />
    <meta name=viewport content=width=device-width, initial-scale=1.0 />
    <title>404 — Page Not Found | Younick Design Studio</title>
    <meta name=robots content=noindex, nofollow, noarchive />
    <meta name=googlebot content=noindex, nofollow, noarchive />
    <meta name=prerender-status-code content=404 />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #08090A;
        color: #FFFFFF;
        font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .container {
        max-width: 540px;
        width: 100%;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #E6B566;
        background: rgba(230, 181, 102, 0.1);
        border: 1px solid rgba(230, 181, 102, 0.25);
        padding: 6px 16px;
        border-radius: 999px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: clamp(64px, 12vw, 120px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.03em;
        color: transparent;
        background: linear-gradient(180deg, rgba(230, 181, 102, 0.9) 0%, rgba(176, 141, 87, 0.3) 100%);
        -webkit-background-clip: text;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 20px;
        font-weight: 500;
        margin-bottom: 12px;
        color: #FFFFFF;
      }
      p {
        font-size: 14px;
        color: #9CA3AF;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #E6B566;
        color: #0B1220;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 999px;
        transition: transform 0.2s, background-color 0.2s;
      }
      .btn:hover {
        background: #F0C988;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class=container>
      <div class=badge>Error 404</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        The space you are looking for has been relocated or does not exist. Let us guide you back to our signature portfolio and design services.
      </p>
      <a href=/ class=btn>Return to Homepage</a>
    </div>
  </body>
</html>
